<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        p{
            background-color: aqua;
            font-style: italic;
            font-size: 20px;
        }
         #para-1{
            background-color: bisque;
            font-weight: bolder;    
        }
         .highlight{
            background-color: yellow;
         }
    </style>
</head>
<body>
    <!-- Inline Style --- tags+style tag -->
     <p id="para-1" style="color: red;">This is para</p>
     <p> paragraph-2</p>
     <div class="highlight">This is div tag having class : highlight</div>
     <div class="container">This is a container.</div>
</body>
</html>
